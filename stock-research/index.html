<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Research Notes</title>
<meta name="description" content="Buy / hold / avoid research on Nigerian (NGX) stocks: Access Holdings, the Dangote Refinery IPO, and a five-stock screen.">
<script src="vendor/marked.min.js"></script>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1d1f23; --muted: #5f6570;
    --border: #e4e1da; --accent: #0f6b4f; --accent-soft: #e5f2ec;
    --warn-soft: #fdf3e1; --warn: #8a5a00; --code: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121416; --surface: #1a1d20; --text: #e7e8ea; --muted: #a0a6ae;
      --border: #2c3136; --accent: #4cc39a; --accent-soft: #173229;
      --warn-soft: #33290f; --warn: #f0c060; --code: #23272b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121416; --surface: #1a1d20; --text: #e7e8ea; --muted: #a0a6ae;
    --border: #2c3136; --accent: #4cc39a; --accent-soft: #173229;
    --warn-soft: #33290f; --warn: #f0c060; --code: #23272b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    border-bottom: 1px solid var(--border); background: var(--surface);
    position: sticky; top: 0; z-index: 5;
  }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .brand { font-weight: 700; margin-right: auto; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav a {
    text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); font-size: 14px; white-space: nowrap;
  }
  nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  .notice {
    background: var(--warn-soft); color: var(--warn); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; margin-bottom: 24px;
  }
  article { overflow-wrap: anywhere; }
  article h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 4px; }
  article h2 { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 1.3rem; }
  article a { color: var(--accent); }
  article blockquote {
    margin: 16px 0; padding: 10px 14px; border-left: 4px solid var(--warn);
    background: var(--warn-soft); border-radius: 0 8px 8px 0;
  }
  article blockquote p { margin: 0; }
  .table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--surface); }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: var(--code); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
  footer { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Stock Research Notes</div>
    <nav id="nav"></nav>
  </div>
</header>
<main>
  <div class="notice">Personal research, not financial advice. Figures come from secondary sources as of the dates shown and may be out of date.</div>
  <article id="report">Loading…</article>
</main>
<footer>Reports live as Markdown in <code>stock-research/reports/</code>.</footer>
<script>
  const REPORTS = [
    { id: "top-5", title: "NGX Top 5", file: "reports/2026-09-24-ngx-top-5.md" },
    { id: "access", title: "Access Holdings", file: "reports/2026-09-24-access-holdings.md" },
    { id: "dangote-ipo", title: "Dangote Refinery IPO", file: "reports/2026-09-24-dangote-refinery-ipo.md" }
  ];

  const nav = document.getElementById("nav");
  const out = document.getElementById("report");

  REPORTS.forEach(r => {
    const a = document.createElement("a");
    a.href = "#" + r.id;
    a.textContent = r.title;
    a.dataset.id = r.id;
    nav.appendChild(a);
  });

  async function show() {
    const id = location.hash.slice(1);
    const report = REPORTS.find(r => r.id === id) || REPORTS[0];
    nav.querySelectorAll("a").forEach(a => {
      if (a.dataset.id === report.id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    try {
      const res = await fetch(report.file);
      if (!res.ok) throw new Error(res.status);
      out.innerHTML = marked.parse(await res.text());
      out.querySelectorAll("table").forEach(t => {
        const head = t.querySelector("thead");
        if (head && !head.textContent.trim()) head.remove();
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        t.replaceWith(wrap);
        wrap.appendChild(t);
      });
      out.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = "_blank";
        a.rel = "noopener";
      });
      document.title = report.title + " · Stock Research Notes";
      window.scrollTo(0, 0);
    } catch (e) {
      out.textContent = "Could not load this report.";
    }
  }

  window.addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
