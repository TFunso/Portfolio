<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Research Notes</title>
<meta name="description" content="Buy / hold / avoid research on Nigerian (NGX) stocks: Access Holdings, the Dangote Refinery IPO, and a five-stock screen.">
<script src="vendor/marked.min.js"></script>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1d1f23; --muted: #5f6570;
    --border: #e4e1da; --accent: #0f6b4f; --accent-soft: #e5f2ec;
    --warn-soft: #fdf3e1; --warn: #8a5a00; --code: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121416; --surface: #1a1d20; --text: #e7e8ea; --muted: #a0a6ae;
      --border: #2c3136; --accent: #4cc39a; --accent-soft: #173229;
      --warn-soft: #33290f; --warn: #f0c060; --code: #23272b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121416; --surface: #1a1d20; --text: #e7e8ea; --muted: #a0a6ae;
    --border: #2c3136; --accent: #4cc39a; --accent-soft: #173229;
    --warn-soft: #33290f; --warn: #f0c060; --code: #23272b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    border-bottom: 1px solid var(--border); background: var(--surface);
    position: sticky; top: 0; z-index: 5;
  }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .brand { font-weight: 700; margin-right: auto; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav a {
    text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); font-size: 14px; white-space: nowrap;
  }
  nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .search { position: relative; flex: 1 1 100%; }
  .search input {
    width: 100%; font: inherit; font-size: 15px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .results {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 70vh; overflow-y: auto;
  }
  .results a { display: block; padding: 10px 14px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--border); }
  .results a:last-child { border-bottom: 0; }
  .results a:hover, .results a:focus { background: var(--accent-soft); outline: none; }
  .results .r-title { font-weight: 600; }
  .results .r-verdict { color: var(--accent); font-size: 13px; }
  .results .r-snip { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .results mark { background: var(--warn-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
  .results .empty { padding: 12px 14px; font-size: 14px; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  .notice {
    background: var(--warn-soft); color: var(--warn); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; margin-bottom: 24px;
  }
  article { overflow-wrap: anywhere; }
  article h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 4px; }
  article h2 { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 1.3rem; }
  article a { color: var(--accent); }
  article blockquote {
    margin: 16px 0; padding: 10px 14px; border-left: 4px solid var(--warn);
    background: var(--warn-soft); border-radius: 0 8px 8px 0;
  }
  article blockquote p { margin: 0; }
  .table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 14px; background: var(--surface); }
  th, td {
    padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top;
    overflow-wrap: normal; max-width: 280px;
  }
  th { background: var(--code); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
  footer { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Stock Research Notes</div>
    <nav id="nav"></nav>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search a stock or ticker, e.g. GTCO, MTNN, Zenith" aria-label="Search stocks">
      <div id="results" class="results" hidden></div>
    </form>
  </div>
</header>
<main>
  <div class="notice">Personal research, not financial advice. Figures come from secondary sources as of the dates shown and may be out of date.</div>
  <article id="report">Loading…</article>
</main>
<footer>Reports live as Markdown in <code>stock-research/reports/</code>.</footer>
<script>
  const REPORTS = [
    { id: "top-5", title: "NGX Top 5", file: "reports/2026-09-24-ngx-top-5.md",
      verdict: "Screen: GTCO, Zenith, MTN Nigeria, Seplat, Dangote Cement",
      keywords: "gtco guaranty trust zenith zenithbank mtn mtnn seplat dangote cement dangcem ngx top picks" },
    { id: "access", title: "Access Holdings", file: "reports/2026-09-24-access-holdings.md",
      verdict: "Hold (64/100) · buy only below ₦25",
      keywords: "access bank accesscorp access holdings" },
    { id: "dangote-ipo", title: "Dangote Refinery IPO", file: "reports/2026-09-24-dangote-refinery-ipo.md",
      verdict: "Watchlist (55/100) · not at ₦525; below ~₦330",
      keywords: "dangote refinery petroleum ipo dprp" },
    { id: "jnj", title: "Johnson & Johnson", file: "reports/2026-09-24-johnson-and-johnson.md",
      verdict: "Hold (74/100, capped) · buy below ~$230",
      keywords: "johnson & johnson j&j jnj johnson and johnson nyse us pharma medtech" },
    { id: "alcon", title: "Alcon", file: "reports/2026-09-24-alcon.md",
      verdict: "Buy (75/100) · starter now; add below ~$58",
      keywords: "alcon alc alcc eye care ophthalmology contact lenses swiss nyse" },
    { id: "medtronic", title: "Medtronic", file: "reports/2026-09-24-medtronic.md",
      verdict: "Buy (78/100) · core position; add below ~$80",
      keywords: "medtronic medtronics mdt medical devices medtech minimed nyse" },
    { id: "gtco", title: "GTCO (GTBank)", file: "reports/2026-09-24-gtco.md",
      verdict: "Buy (76/100) · 5% position; add below ~₦110",
      keywords: "gtco gtbank gt bank guaranty trust holding ngx nigeria bank" },
    { id: "bua-foods", title: "BUA Foods", file: "reports/2026-09-25-bua-foods.md",
      verdict: "Watchlist (57/100) · buy only below ~₦550",
      keywords: "bua foods buafoods bua sugar flour pasta rice rabiu ngx nigeria" },
    { id: "wema", title: "Wema Bank", file: "reports/2026-09-25-wema-bank.md",
      verdict: "Hold (68/100) · small starter; buy below ~₦26",
      keywords: "wema wemabank wema bank alat ngx nigeria bank" }
  ];

  const nav = document.getElementById("nav");
  const out = document.getElementById("report");

  REPORTS.forEach(r => {
    const a = document.createElement("a");
    a.href = "#" + r.id;
    a.textContent = r.title;
    a.dataset.id = r.id;
    nav.appendChild(a);
  });

  async function show() {
    const id = location.hash.slice(1);
    const report = REPORTS.find(r => r.id === id) || REPORTS[0];
    nav.querySelectorAll("a").forEach(a => {
      if (a.dataset.id === report.id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    try {
      const res = await fetch(report.file);
      if (!res.ok) throw new Error(res.status);
      // "~" means "approximately" in the reports, not strikethrough.
      out.innerHTML = marked.parse((await res.text()).replace(/~/g, "&#126;"));
      out.querySelectorAll("table").forEach(t => {
        const head = t.querySelector("thead");
        if (head && !head.textContent.trim()) head.remove();
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        t.replaceWith(wrap);
        wrap.appendChild(t);
      });
      out.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = "_blank";
        a.rel = "noopener";
      });
      document.title = report.title + " · Stock Research Notes";
      window.scrollTo(0, 0);
    } catch (e) {
      out.textContent = "Could not load this report.";
    }
  }

  window.addEventListener("hashchange", show);
  show();

  // Search across report titles, tickers and full text.
  const q = document.getElementById("q");
  const results = document.getElementById("results");
  const texts = {};
  const loaded = Promise.all(REPORTS.map(r =>
    fetch(r.file).then(res => res.ok ? res.text() : "").catch(() => "")
      .then(t => { texts[r.id] = t.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[#*|>_`]/g, " "); })));

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  function snippet(text, term) {
    const i = text.toLowerCase().indexOf(term);
    if (i < 0) return "";
    const s = text.slice(Math.max(0, i - 60), i + term.length + 80).replace(/\s+/g, " ").trim();
    return "…" + esc(s).replace(new RegExp(escRe(esc(term)), "ig"), m => "<mark>" + m + "</mark>") + "…";
  }

  async function search() {
    const term = q.value.trim().toLowerCase();
    if (!term) { results.hidden = true; return; }
    await loaded;
    const hits = REPORTS.map(r => {
      const text = texts[r.id] || "";
      const meta = (r.title + " " + r.keywords).toLowerCase();
      const count = text.toLowerCase().split(term).length - 1;
      const score = (meta.includes(term) ? 100 : 0) + count;
      return { r, score, snip: snippet(text, term) };
    }).filter(h => h.score > 0).sort((a, b) => b.score - a.score);

    results.innerHTML = hits.length
      ? hits.map(h => `<a href="#${h.r.id}"><div class="r-title">${esc(h.r.title)}</div>` +
          `<div class="r-verdict">${esc(h.r.verdict)}</div>` +
          (h.snip ? `<div class="r-snip">${h.snip}</div>` : "") + `</a>`).join("")
      : `<div class="empty">No report on “${esc(q.value.trim())}” yet. This page only covers stocks that have already been analysed. Ask for a new analysis and it will be added here.</div>`;
    results.hidden = false;
  }

  q.addEventListener("input", search);
  q.addEventListener("focus", search);
  document.getElementById("search-form").addEventListener("submit", e => {
    e.preventDefault();
    const first = results.querySelector("a");
    if (first) { location.hash = first.getAttribute("href"); results.hidden = true; q.blur(); }
  });
  results.addEventListener("click", e => { if (e.target.closest("a")) results.hidden = true; });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") results.hidden = true; });
</script>
</body>
</html>
