name: RentRadar AI Rent Hunter

on:
  schedule:
    # Every 30 minutes. GitHub Actions cron can lag under load; that's fine
    # for this workload -- see docs/DEPLOYMENT.md for the tradeoffs.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # allows a manual "Run workflow" trigger from the Actions tab

defaults:
  run:
    working-directory: rentradar

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Requires the DATABASE_URL secret at minimum (Settings -> Secrets and
    # variables -> Actions). ANTHROPIC_API_KEY / SENDGRID_API_KEY /
    # TWILIO_* / NEXT_PUBLIC_MAPBOX_TOKEN are optional -- the worker no-ops
    # each integration it doesn't have credentials for.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rentradar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ingestion (dedupe, score, persist, alert)
        run: npm run hunter:run
